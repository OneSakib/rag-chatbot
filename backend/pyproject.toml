[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-chatbot"
version = "0.1.0"
description = "Production-ready FastAPI project boilerplate"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]==0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.2.0",
    "langchain>=1.4.2",
    "langchain-openai>=1.6.6",
    "langgraph>=1.2.12",
    "pyjwt>=2.15.0",
    "python-multipart>=0.0.32",
    "python-dotenv>=1.2.3",
    "langsmith>=0.14.0",
    "celery>=5.6.3",
    "redis==4.6.0",
    "flower>=2.2.0",
    "psycopg2-binary>=2.9.13",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

# Without this, setuptools flat-layout auto-discovery sees both `app` and
# `tests` as top-level packages and refuses to build.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]



[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = true
plugins = []

